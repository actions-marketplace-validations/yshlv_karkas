[project]
name = "karkas"
version = "0.1.0"
description = "Live Architecture Skeleton & Contract Validator for Python Backends"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Karkas Contributors" }
]
keywords = [
    "architecture",
    "skeleton",
    "karkas",
    "topology",
    "documentation",
    "fastapi",
    "clean-architecture",
    "obsidian",
    "pydantic",
    "static-analysis",
    "ddd",
    "contract-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "libcst>=1.1.0",
    "jinja2>=3.1.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/yshlv/karkas"
Repository = "https://github.com/yshlv/karkas"
Documentation = "https://github.com/yshlv/karkas#readme"
Issues = "https://github.com/yshlv/karkas/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
karkas = "karkas.cli:app"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "PERF102"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
