[project]
name = "archdoc"
version = "0.1.0"
description = "Live Architecture Documentation & Contract Validator for Python Backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "libcst>=1.1.0",
    "jinja2>=3.1.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
archdoc = "archdoc.cli:app"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "PERF102"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
